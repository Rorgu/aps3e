name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: List projects
        run: ./gradlew projects

      - name: List tasks
        run: ./gradlew tasks --all

      - name: Build APK (auto-detect)
        run: |
          ./gradlew tasks --all | grep assembleDebug

          echo "Trying common Android modules..."

          if ./gradlew :app:assembleDebug; then exit 0; fi
          if ./gradlew :android:assembleDebug; then exit 0; fi
          if ./gradlew :aps3e:assembleDebug; then exit 0; fi

          echo "No known module worked"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/debug/*.apk"
