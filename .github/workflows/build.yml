name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant permission
        run: chmod +x ./gradlew

      - name: Show project tree
        run: ./gradlew projects || true

      - name: Show all tasks (safe)
        run: ./gradlew tasks --all || true

      - name: Detect and build APK
        run: |
          set +e

          echo "Trying :app:assembleDebug"
          ./gradlew :app:assembleDebug
          if [ $? -eq 0 ]; then exit 0; fi

          echo "Trying :android:assembleDebug"
          ./gradlew :android:assembleDebug
          if [ $? -eq 0 ]; then exit 0; fi

          echo "Trying :aps3e:assembleDebug"
          ./gradlew :aps3e:assembleDebug
          if [ $? -eq 0 ]; then exit 0; fi

          echo "Trying root assembleDebug"
          ./gradlew assembleDebug
          if [ $? -eq 0 ]; then exit 0; fi

          echo "BUILD FAILED: No valid Android module found"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/debug/*.apk"
